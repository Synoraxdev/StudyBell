name: Signed release APK (manual)

# Run from the Actions tab. Requires these repository secrets:
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          STUDYBELL_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          STUDYBELL_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          STUDYBELL_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STUDYBELL_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then GRADLE="./gradlew"; chmod +x gradlew; else GRADLE="gradle"; fi
          $GRADLE --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: StudyBell-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
